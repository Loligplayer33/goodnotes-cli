[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goodnotes-local-cli"
version = "0.1.0"
description = "Read and search a sandbox copy of your local Goodnotes library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "David Haase"}]
dependencies = ["typer>=0.27.3,<0.28", "pymupdf>=1.26,<2"]

[project.scripts]
goodnotes = "goodnotes_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "ty>=0.0.91,<0.1",
    "pytest-xdist>=3.8,<4",
    "hypothesis>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goodnotes_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
