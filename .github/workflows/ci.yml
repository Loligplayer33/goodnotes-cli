name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Check types
        run: uv run --locked mypy src/goodnotes_cli tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install native annotation reader
        if: runner.os == 'macOS'
        run: brew install rocksdb

      - name: Run tests
        env:
          GOODNOTES_REQUIRE_NATIVE_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: uv run --locked pytest

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check release version and changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --locked python - "$GITHUB_REF_NAME" <<'PY'
          from pathlib import Path
          import sys
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = sys.argv[1]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match project version {version!r}")

          heading = f"## [{version}]"
          if not any(line.startswith(heading) for line in Path("CHANGELOG.md").read_text().splitlines()):
              raise SystemExit(f"CHANGELOG.md has no release heading for {version}")
          PY

      - name: Build source distribution and wheel
        run: uv build

      - name: Create an isolated wheel environment
        run: uv venv --python 3.12 "$RUNNER_TEMP/goodnotes-wheel"

      - name: Install the wheel
        run: uv pip install --python "$RUNNER_TEMP/goodnotes-wheel/bin/python" dist/*.whl

      - name: Run the installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/goodnotes-wheel/bin/goodnotes" schema > schema.json
          test -s schema.json

      - name: Create an isolated source distribution environment
        run: uv venv --python 3.12 "$RUNNER_TEMP/goodnotes-sdist"

      - name: Install the source distribution
        run: uv pip install --python "$RUNNER_TEMP/goodnotes-sdist/bin/python" dist/*.tar.gz

      - name: Run the source-installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/goodnotes-sdist/bin/goodnotes" schema > sdist-schema.json
          test -s sdist-schema.json

      - name: Upload release distributions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [quality, tests, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
